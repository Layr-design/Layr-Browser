<!doctype html><html lang="en"><meta charset="utf-8"><title>Nested scroll fixture</title><style>body{margin:30px}#feed{height:180px;width:300px;overflow:auto;border:1px solid} .item{height:80px}</style><main><h1>Nested scroll</h1><section id="feed" aria-label="Results" tabindex="0"><div class="item">Item 1</div><div class="item">Item 2</div><div class="item">Item 3</div><div class="item">Item 4</div><div class="item">Item 5</div></section><output id="position"></output></main><script>document.getElementById('feed').addEventListener('scroll', event => document.getElementById('position').textContent = 'Scroll ' + Math.round(event.target.scrollTop));</script></html>
